name: Mise à jour de la veille

on:
  # Planification suspendue le 31 octobre 2026 (le site n'est pas encore publié).
  # Pour la réactiver, remettre :
  #   schedule:
  #     - cron: "17 5 * * 1-6"   # 05:17 UTC, du lundi au samedi
  workflow_dispatch: {}

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: veille
  cancel-in-progress: false

jobs:
  collecte:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Installer les outils
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq poppler-utils
          pip install -r requirements.txt

      - name: Tester les analyseurs
        run: python -m unittest discover -s tests -v

      - name: Collecter les données
        run: python collect/build.py

      - name: Rédiger les résumés IA (si la clé est configurée)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python collect/summarize.py

      - name: Enregistrer les données dans le dépôt
        run: |
          git config user.name "veille-bot"
          git config user.email "veille-bot@users.noreply.github.com"
          git add site/data cache
          if git diff --cached --quiet; then
            echo "Aucune nouveauté."
          else
            git commit -m "Données du $(date -u +%F)"
            git push
          fi

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  publication:
    needs: collecte
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploiement.outputs.page_url }}
    steps:
      - id: deploiement
        uses: actions/deploy-pages@v4
